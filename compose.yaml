name: casarenous

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-casarenous}
      POSTGRES_USER: ${POSTGRES_USER:-casarenous}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Definis POSTGRES_PASSWORD dans .env}
      TZ: Europe/Paris
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-casarenous}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-casarenous}
      UPLOAD_DIR: /data/uploads
      APP_ORIGIN: ${APP_ORIGIN:-https://casarenous.martylab.fr}
      EXTRA_ORIGINS: ""
      COOKIE_SECURE: "true"
      TRUST_PROXY: "1"
      TZ: Europe/Paris
    volumes:
      - uploads:/data/uploads
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    read_only: true
    tmpfs:
      - /tmp:size=64m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  portal:
    build:
      context: .
      dockerfile: apps/portal/Dockerfile
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs
      - ./certbot-webroot:/var/www/certbot:ro
    networks:
      - internal
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=64m
      - /var/run:size=16m
      - /var/log/nginx:size=16m
      - /tmp:size=16m
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mailhog:
    image: mailhog/mailhog
    profiles: ["dev"]
    restart: unless-stopped
    ports:
      - "8025:8025"
    networks:
      - internal
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "2"

  backup:
    image: postgres:17-alpine
    profiles: ["backup"]
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGUSER: ${POSTGRES_USER:-casarenous}
      PGDATABASE: ${POSTGRES_DB:-casarenous}
      TZ: Europe/Paris
    volumes:
      - uploads:/data/uploads:ro
      - ./backups:/backups
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /backups
        while true; do
          stamp=$$(date +%Y%m%d-%H%M%S)
          pg_dump -h db -Fc > "/backups/casarenous-$$stamp.dump"
          tar -czf "/backups/uploads-$$stamp.tar.gz" -C /data uploads
          find /backups -type f -mtime +14 -delete
          echo "[backup] sauvegarde $$stamp terminée"
          sleep 86400
        done
    security_opt:
      - no-new-privileges:true

volumes:
  pgdata:
  uploads:

networks:
  internal:
    driver: bridge
    internal: false
