# Développement local uniquement.
#   docker compose -f compose.yaml -f compose.dev.yaml --profile dev up -d db backend mailhog
#   npm run dev:portal
# Le backend est publié sur 127.0.0.1 uniquement, jamais sur l'interface publique.
services:
  backend:
    environment:
      NODE_ENV: development
      APP_ORIGIN: http://localhost:5173
      EXTRA_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174,http://localhost:4174,http://127.0.0.1:4174
      COOKIE_SECURE: "false"
      MAIL_TRANSPORT: smtp
      SMTP_URL: smtp://mailhog:1025
    ports:
      - "127.0.0.1:3000:3000"

  mailhog:
    ports:
      - "127.0.0.1:8025:8025"
      - "127.0.0.1:1025:1025"
