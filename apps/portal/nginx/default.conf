upstream casarenous_api {
  server backend:3000;
  keepalive 16;
}

server {
  listen 80 default_server;
  listen [::]:80 default_server;
  server_name casarenous.martylab.fr localhost;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Renouvellement Let's Encrypt en mode webroot (voir README).
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type text/plain;
  }

  location / {
    return 301 https://$host$request_uri;
  }
}

server {
  listen 443 ssl default_server;
  listen [::]:443 ssl default_server;
  http2 on;
  server_name casarenous.martylab.fr localhost;

  ssl_certificate /etc/nginx/certs/fullchain.pem;
  ssl_certificate_key /etc/nginx/certs/privkey.pem;
  ssl_protocols TLSv1.2 TLSv1.3;
  ssl_ciphers HIGH:!aNULL:!MD5;
  ssl_prefer_server_ciphers off;
  ssl_session_cache shared:SSL:10m;
  ssl_session_timeout 1d;
  ssl_session_tickets off;

  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
  include /etc/nginx/security-headers.conf;

  root /usr/share/nginx/html;
  index index.html;

  location = /healthz {
    access_log off;
    default_type text/plain;
    return 200 "ok\n";
  }

  # Le HTML, le manifest et les service workers ne doivent jamais être figés :
  # sinon une PWA reste bloquée sur une ancienne version.
  location = /index.html {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location = /manifest.webmanifest {
    default_type application/manifest+json;
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    add_header Service-Worker-Allowed "/" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location = /push-sw.js {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  # Ressources statiques versionnées ou remplaçables : le Cache-Control ne doit
  # s'appliquer QU'AUX réponses 2xx/3xx/304. Sans le drapeau « always », nginx
  # n'ajoute pas l'en-tête aux 404 : sinon un fichier demandé avant son
  # déploiement (ex. models/*.glb) resterait « en cache manquant » côté
  # navigateur pendant 30 jours, même une fois le fichier en ligne.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location /icons/ {
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location /brand/ {
    add_header Cache-Control "public, max-age=604800";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location /models/ {
    add_header Cache-Control "public, max-age=2592000";
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location = /offline.html {
    add_header Cache-Control "no-cache" always;
    include /etc/nginx/security-headers.conf;
    try_files $uri =404;
  }

  location /api/ {
    limit_req zone=api_limit burst=40 nodelay;
    proxy_pass http://casarenous_api;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_read_timeout 75s;
    proxy_send_timeout 75s;
    proxy_connect_timeout 10s;
    proxy_buffering on;
    include /etc/nginx/security-headers.conf;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~ /\.(?!well-known) {
    deny all;
  }
}
