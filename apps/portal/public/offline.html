<!doctype html>
<html lang="fr" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>CasaRenous — Hors ligne</title>
    <style>
      :root {
        --bg: oklch(0.96 0.012 79.8);
        --surface: oklch(1 0 0);
        --ink: oklch(0.303 0.009 248.1);
        --muted: oklch(0.496 0.017 251.3);
        --line: oklch(0.895 0.012 79.8);
        --accent: oklch(0.535 0.144 38.1);
        --on-accent: oklch(1 0 0);
        --gold: oklch(0.752 0.109 78.4);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: oklch(0.231 0.004 84.6);
          --surface: oklch(0.303 0.009 248.1);
          --ink: oklch(0.96 0.012 79.8);
          --muted: oklch(0.82 0.012 79.8);
          --line: oklch(0.36 0.01 248.1);
          --accent: oklch(0.752 0.109 78.4);
          --on-accent: oklch(0.303 0.009 248.1);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: var(--bg);
        color: var(--ink);
        font-family: "Inter Variable", "Inter", ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
      }
      .card {
        width: min(100%, 380px);
        padding: 30px 26px;
        border: 1px solid var(--line);
        border-radius: 28px;
        background: var(--surface);
        box-shadow: 0 24px 60px -32px oklch(0.231 0.004 84.6 / 0.45);
      }
      .mark {
        display: block;
        width: 88px;
        height: 88px;
        margin: 0 auto 16px;
      }
      .kicker {
        margin: 0 0 6px;
        font-size: 10.5px;
        font-weight: 700;
        letter-spacing: 0.16em;
        text-transform: uppercase;
        color: var(--accent);
      }
      h1 {
        margin: 0 0 8px;
        font-family: "Fraunces Variable", "Fraunces", Georgia, serif;
        font-size: 27px;
        font-weight: 600;
        letter-spacing: -0.02em;
        line-height: 1.15;
      }
      p {
        margin: 0;
        color: var(--muted);
        font-size: 14px;
        line-height: 1.55;
      }
      button {
        margin-top: 20px;
        min-height: 46px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        background: var(--accent);
        color: var(--on-accent);
        font: inherit;
        font-weight: 600;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img class="mark" src="/brand/casarenous-symbol.svg" width="88" height="88" alt="" />
      <p class="kicker">Carnet de chantier</p>
      <h1>Vous êtes hors ligne</h1>
      <p>
        Les pages et les données déjà chargées restent disponibles. Les photos,
        notes et réserves seront synchronisées au retour du réseau.
      </p>
      <button type="button" onclick="location.reload()">Réessayer</button>
    </main>
  </body>
</html>
